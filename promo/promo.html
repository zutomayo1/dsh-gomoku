<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-gomoku · 宣传片</title>
<style>
  /* 逐帧渲染：全部动效由 JS 按 t 算成内联样式（没有 CSS transition/rAF/Math.random/
     Date.now）。同一个 t 永远同一帧 —— 这是能稳定逐帧截图的前提。 */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000}
  #stage{
    position:relative;width:1920px;height:1080px;overflow:hidden;
    background:#05060a;color:#e9ebf0;
    font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  /* 世界层：只承受屏幕震动。
     注意**不要**在这里加 perspective / transform-style:preserve-3d —— 一旦成为 3D
     渲染上下文，子元素的 z-index 就失效了，3D 旋转过的窗口会盖住上层大字
     （「五连」标题因此整块消失过）。透视放到各自需要的地方：#app 与 #s5 .col。 */
  #world{position:absolute;inset:0}
  .layer{position:absolute;inset:0;pointer-events:none}
  canvas{display:block}
  #fxBack{position:absolute;inset:0;z-index:1}
  .big{font-weight:800;letter-spacing:.01em;line-height:1.05}

  /* ---------- 背景 ---------- */
  #bgGlow{background:
    radial-gradient(820px 660px at 62% 38%, rgba(76,141,255,.24), rgba(76,141,255,0) 70%),
    radial-gradient(980px 760px at 16% 80%, rgba(255,150,40,.13), rgba(255,150,40,0) 72%),
    radial-gradient(1200px 900px at 50% 50%, rgba(20,26,40,.9), #05060a 78%)}
  #bgGrid{
    background-image:linear-gradient(rgba(140,190,255,.07) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(140,190,255,.07) 1px,transparent 1px);
    background-size:72px 72px;
    mask-image:radial-gradient(1200px 820px at 50% 48%,#000 0%,rgba(0,0,0,.3) 60%,transparent 100%);
    -webkit-mask-image:radial-gradient(1200px 820px at 50% 48%,#000 0%,rgba(0,0,0,.3) 60%,transparent 100%);
  }

  /* ---------- 开场：棋盘英雄镜头 ---------- */
  #s1{display:grid;place-items:center;text-align:center;z-index:3;background:
    radial-gradient(760px 460px at 50% 48%, rgba(5,6,10,.80), rgba(5,6,10,.35) 58%, rgba(5,6,10,0) 78%)}
  #heroBoard{position:absolute;left:50%;top:57%;width:880px;height:880px;margin:-440px 0 0 -440px;
    border-radius:18px;overflow:hidden;
    box-shadow:0 60px 160px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.07),
               0 0 120px rgba(255,180,80,.18)}
  #heroBoard svg{display:block;width:880px;height:880px}
  #sweep{position:absolute;inset:-10%;background:linear-gradient(102deg,
    rgba(255,255,255,0) 38%, rgba(255,255,255,.30) 48%, rgba(120,200,255,.22) 54%, rgba(255,255,255,0) 64%);
    mix-blend-mode:screen;opacity:0}
  #s1 .stack{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;gap:22px}
  #s1 h1{font-size:190px;letter-spacing:-.01em}
  #s1 .kicker{font-size:21px;letter-spacing:.42em;color:#9fb4d8}
  #s1 .sub{font-size:32px;color:#cfd9ea;font-weight:600}
  #s1 .rule{height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(76,141,255,0),#8ec5ff,rgba(76,141,255,0))}
  #s1 .stack{filter:drop-shadow(0 8px 40px rgba(0,0,0,.9))}

  /* 色差（chromatic aberration）：同一个字画三份，红/青两路 blend 上去 */
  .chroma{position:relative;display:inline-block}
  .chroma::before,.chroma::after{content:attr(data-text);position:absolute;left:0;top:0;
    mix-blend-mode:screen;opacity:var(--ca,0);pointer-events:none}
  .chroma::before{color:#ff2f6b;transform:translateX(calc(var(--cx,0px) * -1))}
  .chroma::after{color:#26e0ff;transform:translateX(var(--cx,0px))}

  /* ---------- 主界面 ---------- */
  #app{display:grid;place-items:center;z-index:2;perspective:1700px}
  #cam{transform-origin:50% 50%;transform-style:preserve-3d}
  .win{
    width:1660px;height:880px;border-radius:16px;overflow:hidden;position:relative;
    background:#0f1116;border:1px solid rgba(255,255,255,.12);
    box-shadow:0 70px 160px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.03) inset,
               0 0 90px rgba(76,141,255,.14);
    display:flex;flex-direction:column;
  }
  .titlebar{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;
    background:#171a21;border-bottom:1px solid rgba(255,255,255,.07)}
  .titlebar .dot{width:11px;height:11px;border-radius:50%;background:#3a3f4a}
  .titlebar .name{font-size:14px;color:#aab2c2;font-weight:600;margin-left:6px}
  .titlebar .spacer{flex:1}
  .titlebar .wbtn{width:34px;height:42px;display:grid;place-items:center;color:#8a92a3}
  .wbtn i{display:block;width:11px;height:1.6px;background:currentColor}
  .body{flex:1;display:flex;min-height:0}

  .rail{width:74px;flex:none;background:#0d0f14;border-right:1px solid rgba(255,255,255,.06);
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0}
  .rail .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.045);
    display:grid;place-items:center;color:#7f8798;font-size:15px;font-weight:700}
  .rail .ic.on{background:rgba(76,141,255,.18);color:#9cc4ff;box-shadow:0 0 0 1px rgba(76,141,255,.4) inset}

  .chat{flex:1;min-width:0;display:flex;flex-direction:column;background:#0f1116}
  .chatHead{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 26px;
    border-bottom:1px solid rgba(255,255,255,.06);color:#cfd6e4;font-size:15px;font-weight:650}
  .chatHead .tag{font-size:12px;font-weight:600;color:#9cc4ff;background:rgba(76,141,255,.16);
    border-radius:999px;padding:3px 10px}
  .msgs{flex:1;padding:26px 26px 8px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
  .msg{max-width:76%;font-size:16px;line-height:1.55}
  .msg.user{align-self:flex-end;background:rgba(76,141,255,.20);border:1px solid rgba(76,141,255,.40);
    color:#eaf2ff;border-radius:14px 14px 4px 14px;padding:12px 16px;
    box-shadow:0 10px 30px rgba(30,80,200,.25)}
  .msg.bot{align-self:flex-start;color:#c8cfdd}
  .msg.bot b{color:#fff;font-weight:650}
  .composer{margin:0 26px 20px;flex:none;height:54px;border-radius:14px;
    background:#171a21;border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;
    gap:12px;padding:0 16px;color:#79808f;font-size:15px}
  .composer .caret{width:2px;height:20px;background:#4c8dff;border-radius:2px}

  .side{width:700px;flex:none;background:#0c0e13;border-left:1px solid rgba(255,255,255,.07);
    display:flex;flex-direction:column}
  .sideTabs{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;
    border-bottom:1px solid rgba(255,255,255,.06)}
  .sideTab{display:flex;align-items:center;gap:8px;height:29px;padding:0 12px;border-radius:8px;
    background:rgba(76,141,255,.18);color:#d6e6ff;font-size:13.5px;font-weight:600;
    box-shadow:0 0 0 1px rgba(76,141,255,.4) inset}
  .sideTab .x{opacity:.5;font-size:12px}
  .sideBody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px 0}
  .boardFrame{position:relative;border-radius:14px}
  #boardFx{position:absolute;left:0;top:0;width:636px;height:636px;pointer-events:none}
  .side .bar{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#9aa3b4}
  .pill{border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.10);color:#c3cbd9;font-size:12.5px;font-weight:600;white-space:nowrap}
  .pill.accent{background:rgba(76,141,255,.20);border-color:rgba(76,141,255,.42);color:#b3d0ff}
  .pill.warm{background:rgba(255,190,90,.18);border-color:rgba(255,190,90,.40);color:#ffdca6}

  #latency{position:absolute;border-radius:12px;padding:8px 14px;font-size:15px;font-weight:800;
    background:rgba(10,14,22,.94);border:1px solid rgba(120,190,255,.55);color:#d6e9ff;
    box-shadow:0 0 26px rgba(76,141,255,.45), 0 14px 34px rgba(0,0,0,.6);
    white-space:nowrap;transform-origin:0 100%;z-index:5}
  #latency b{color:#fff}

  /* ---------- 动能大字（飞入的镜头标题）---------- */
  /* 大字常常落在浅色木纹上，所以既要有投影，也要给自己垫一层暗底 */
  .kinetic{position:absolute;left:0;right:0;top:176px;text-align:center;z-index:6;
    background:radial-gradient(720px 280px at 50% 48%, rgba(4,6,11,.80), rgba(4,6,11,0) 76%)}
  .kinetic .t{display:inline-block;font-size:96px;font-weight:900;letter-spacing:.02em;color:#fff;
    text-shadow:0 0 50px rgba(120,190,255,.55), 0 4px 18px rgba(0,0,0,.95), 0 16px 44px rgba(0,0,0,.85)}
  .kinetic .s{margin-top:10px;font-size:24px;color:#e6edf9;font-weight:700;letter-spacing:.06em;
    text-shadow:0 2px 14px rgba(0,0,0,.95), 0 0 26px rgba(0,0,0,.85)}
  .kinetic .u{display:block;height:4px;border-radius:4px;margin:16px auto 0;
    background:linear-gradient(90deg,rgba(76,141,255,0),#8ec5ff,rgba(76,141,255,0));
    box-shadow:0 0 18px rgba(120,190,255,.8)}

  /* ---------- 字幕 ---------- */
  #caption{position:absolute;left:0;right:0;top:auto;bottom:84px;display:flex;justify-content:center;z-index:8}
  #capInner{display:flex;align-items:center;gap:14px;padding:13px 26px;border-radius:999px;
    background:rgba(8,10,16,.86);border:1px solid rgba(140,190,255,.22);
    box-shadow:0 20px 50px rgba(0,0,0,.65), 0 0 30px rgba(76,141,255,.18)}
  #capDot{width:9px;height:9px;border-radius:50%;background:#6fb0ff;box-shadow:0 0 16px #6fb0ff}
  #capText{font-size:23px;font-weight:600;color:#eaf1fb}

  /* ---------- S4 五连 ---------- */
  /* 别给这里的标题起 class="win" —— .win 是主窗口那个盒子的类（踩过） */
  #s4{display:flex;flex-direction:column;align-items:center;padding-top:64px;gap:8px;text-align:center;z-index:7}
  #s4win{font-size:142px;color:#fff;
    text-shadow:0 0 80px rgba(255,206,74,.85), 0 4px 20px rgba(0,0,0,.95), 0 0 26px rgba(255,255,255,.6)}
  #s4 .sub{font-size:28px;color:#ffd79a;font-weight:700;letter-spacing:.02em}
  #s4 .chips{display:flex;gap:12px;margin-top:2px}
  #shock{position:absolute;left:50%;top:63%;width:140px;height:140px;margin:-70px 0 0 -70px;
    border-radius:50%;border:4px solid rgba(255,214,120,.9)}

  /* ---------- S5 模式 ---------- */
  #s5{display:grid;place-items:center;background:rgba(4,6,11,.80);z-index:7}
  #s5 .col{display:flex;flex-direction:column;align-items:center;gap:42px;perspective:1400px}
  #s5 .head{font-size:62px;font-weight:900;letter-spacing:.01em}
  #s5 .cards{position:relative;display:flex;gap:28px}
  #s5 .card{width:452px;height:300px;border-radius:20px;padding:30px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#191c24,#0e1015);border:1px solid rgba(255,255,255,.10);
    display:flex;flex-direction:column;gap:12px}
  #s5 .card .k{font-size:13px;letter-spacing:.22em;color:#8fa3c4;font-weight:700}
  #s5 .card h3{font-size:42px;font-weight:900;color:#fff}
  #s5 .card p{font-size:19px;line-height:1.6;color:#a7b0c2}
  #s5 .card .glyph{position:absolute;right:24px;top:20px;font-size:34px;opacity:.55}
  #s5 .glow{position:absolute;inset:0;border-radius:20px;pointer-events:none}

  /* ---------- S6 收尾 ---------- */
  #s6{display:grid;place-items:center;text-align:center;background:#05060a;z-index:9}
  #s6 .col{display:flex;flex-direction:column;align-items:center;gap:22px}
  #s6 .icon{width:118px;height:118px;filter:drop-shadow(0 18px 50px rgba(255,190,90,.35))}
  #s6 h2{font-size:86px;text-shadow:0 0 60px rgba(120,190,255,.35)}
  #s6 .url{font-size:27px;color:#a9c9ff;font-weight:700;letter-spacing:.01em}
  #s6 code{display:block;text-align:left;white-space:pre;font-family:ui-monospace,Consolas,monospace;
    font-size:19px;color:#d3dcec;background:#0c0e14;border:1px solid rgba(140,190,255,.20);
    border-radius:12px;padding:16px 20px;line-height:1.7;
    box-shadow:0 0 40px rgba(76,141,255,.12)}
  #s6 code i{color:#7c8798;font-style:normal}
  #s6 .foot{display:flex;gap:12px;align-items:center;font-size:17px;color:#95a0b4}

  /* ---------- 后期叠加 ---------- */
  #scan{position:absolute;inset:0;z-index:50;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.045) 0 1px,transparent 1px 3px);
    opacity:.45;mix-blend-mode:overlay}
  #bars .bar{position:absolute;left:0;right:0;height:56px;background:#000;z-index:60}
  #bars .top{top:0}#bars .bot{bottom:0}
  #vig{position:absolute;inset:0;z-index:55;pointer-events:none;
    background:radial-gradient(1250px 820px at 50% 46%,rgba(0,0,0,0) 46%,rgba(0,0,0,.72) 100%)}
  #flash{position:absolute;inset:0;z-index:70;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div class="layer" id="bgGlow"></div>
    <div class="layer" id="bgGrid"></div>
    <canvas id="fxBack" width="1920" height="1080"></canvas>

    <!-- 开场：棋盘英雄镜头 -->
    <section class="layer" id="s1">
      <div id="heroBoard"><div id="heroSweep"><div id="sweep"></div></div></div>
      <div class="stack">
        <div class="kicker" id="s1kick">DEEPSEEK HARNESS 插件</div>
        <h1 class="big" id="s1title"><span class="chroma" data-text="五子棋">五子棋</span></h1>
        <div class="rule" id="s1rule"></div>
        <div class="sub" id="s1sub">棋盘常驻右侧边栏 · 边聊边下</div>
      </div>
    </section>

    <!-- 主界面 -->
    <section class="layer" id="app">
      <div id="cam">
        <div class="win">
          <div class="titlebar">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="name">DeepSeek Harness</span><span class="spacer"></span>
            <span class="wbtn"><i></i></span>
            <span class="wbtn"><i style="width:9px;height:9px;background:none;border:1.6px solid currentColor"></i></span>
            <span class="wbtn"><i></i></span>
          </div>
          <div class="body">
            <div class="rail"><div class="ic on">五</div><div class="ic">◎</div><div class="ic">≡</div><div class="ic">⌘</div></div>
            <div class="chat">
              <div class="chatHead">新会话<span class="tag">五子棋</span></div>
              <div class="msgs" id="msgs"></div>
              <div class="composer"><span class="caret"></span><span id="composerText">说点什么…</span></div>
            </div>
            <div class="side" id="side">
              <div class="sideTabs"><span class="sideTab"><span>五子棋</span><span class="x">✕</span></span></div>
              <div class="sideBody">
                <div class="boardFrame" id="boardFrame"></div>
                <div class="bar">
                  <span class="pill accent" id="pillMode">对手：引擎</span>
                  <span class="pill" id="pillMoves">第 0 手</span>
                  <span class="pill" id="pillLast">等待落子</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 动能大字（跨场景复用，按时间改内容）-->
    <div class="kinetic" id="kinetic">
      <div class="t" id="kinTitle"></div>
      <div class="s" id="kinSub"></div>
      <span class="u" id="kinRule"></span>
    </div>

    <!-- 五连 -->
    <section class="layer" id="s4">
      <div id="shock"></div>
      <div class="big" id="s4win"><span class="chroma" data-text="五连">五连</span></div>
      <div class="sub" id="s4sub">第 37 手 · 黑棋连成 (7,8) → (11,8)</div>
      <div class="chips">
        <span class="pill accent">引擎执黑</span><span class="pill">人类执白</span>
        <span class="pill warm">37 手 · 全程毫秒级</span>
      </div>
    </section>

    <!-- 模式 -->
    <section class="layer" id="s5">
      <div class="col"><div class="head">对手可以换</div><div class="cards" id="s5cards"></div></div>
    </section>

    <!-- 收尾 -->
    <section class="layer" id="s6">
      <div class="col">
        <span class="icon" id="s6icon"></span>
        <h2 class="big">dsh-gomoku</h2>
        <div class="url">github.com/zutomayo1/dsh-gomoku</div>
        <code id="s6code"></code>
        <div class="foot">
          <span class="pill accent">MIT</span><span>棋盘常驻右侧边栏</span><span style="opacity:.4">·</span>
          <span>引擎毫秒级应手</span><span style="opacity:.4">·</span><span>314 项自检</span>
        </div>
      </div>
    </section>

    <div class="layer" id="caption"><div id="capInner"><span id="capDot"></span><span id="capText"></span></div></div>
  </div>

  <div class="layer" id="vig"></div>
  <div class="layer" id="scan"></div>
  <div class="layer" id="bars"><div class="bar top"></div><div class="bar bot"></div></div>
  <div class="layer" id="flash"></div>
</div>

<script>
/* ============================================================================
 * dsh-gomoku 宣传片 · 确定性舞台
 *
 * 全部动效由 __seek(t)（秒）算成内联样式 / canvas 绘制：没有 CSS transition、
 * 没有 requestAnimationFrame、没有 Math.random、没有 Date.now。同一个 t 永远
 * 给出同一帧 —— 这是逐帧截图能稳定的前提。
 *
 * 棋盘照抄 dsh-gomoku-client 的真实绘制参数（STEP/PAD/STONE_R、木纹四段渐变、
 * 11 条木纹带、棋子六层叠加、星位、坐标字号）；对局是真实的一局 37 手。
 * ========================================================================== */
const DURATION = 26.2;
const ENGINE_MS = "4.1";   // 实测中位耗时，复测命令见 promo/README.md

/* ---------- 抄自 dsh-gomoku-client ---------- */
const STEP = 40, PAD = 38, LINE = 1.15, STONE_R = 17.3;
const SPAN = PAD * 2 + 14 * STEP;                        // 636
const coordOf = (i) => PAD + i * STEP;
const STAR_POINTS = [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]];
const GRAIN = [
  { y: 22, h: 3.4, o: 0.5 }, { y: 74, h: 2.2, o: 0.36 }, { y: 128, h: 4.6, o: 0.62 },
  { y: 186, h: 2.6, o: 0.4 }, { y: 238, h: 3.0, o: 0.5 }, { y: 296, h: 2.0, o: 0.32 },
  { y: 352, h: 4.2, o: 0.58 }, { y: 410, h: 2.4, o: 0.38 }, { y: 468, h: 3.2, o: 0.52 },
  { y: 526, h: 2.2, o: 0.34 }, { y: 580, h: 3.8, o: 0.46 },
];
const ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Gomoku">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d7a8"/>
      <stop offset="0.55" stop-color="#e5bd82"/>
      <stop offset="1" stop-color="#d09e5d"/>
    </linearGradient>
    <radialGradient id="blackStone" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#7c7c82"/>
      <stop offset="0.45" stop-color="#33333a"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </radialGradient>
    <radialGradient id="whiteStone" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2eee7"/>
      <stop offset="1" stop-color="#c6c0b6"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="2.5" y="2.5" width="43" height="43" rx="9"/>
    </clipPath>
  </defs>

  <!-- 棋盘 -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="9" fill="url(#wood)"/>
  <g clip-path="url(#frame)">
    <path d="M-4 15 L52 5" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.28"/>
    <path d="M-4 36 L52 27" stroke="#8a5a2b" stroke-width="3" fill="none" opacity="0.14"/>
  </g>

  <!-- 棋路：以中心为对称轴的四条线 -->
  <g stroke="#8a5a2b" stroke-width="1" opacity="0.6" stroke-linecap="round">
    <path d="M13.2 7.5V40.5"/>
    <path d="M20.4 7.5V40.5"/>
    <path d="M27.6 7.5V40.5"/>

/** 第 i 手落下的时刻：前 26 手像连珠炮，后 11 手慢下来（速度渐变）。 */
function moveTime(i) {
  return i < T.moveSlowFrom
    ? T.movesAt + i * T.moveGapFast
    : T.movesAt + T.moveSlowFrom * T.moveGapFast + (i - T.moveSlowFrom) * T.moveGapSlow;
}

/* ---------- 工具 ---------- */
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const span = (t, a, b) => clamp01((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeOutQuint = (x) => 1 - Math.pow(1 - x, 5);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, x) => a + (b - a) * x;
/** 固定伪随机：不用 Math.random，保证逐帧可复现。 */
const hash = (n) => { const s = Math.sin(n * 127.1 + 11.7) * 43758.5453; return s - Math.floor(s); };
const setStyle = (el, obj) => { for (const k in obj) el.style[k] = obj[k]; };

/* 镜头关键帧：[t, scale, x, y, rotZ, rotX, rotY] */
const CAM = [
  [3.05, 1.00, 0, 0, 0, 0, 0],
  [3.75, 1.03, -6, -6, 0, 9, -7],     // 从下前方带角度飞来
  [5.20, 1.01, -12, -2, 0, -2, 3],    // 轻微回摆
  [7.30, 1.05, -26, 0, 0, 0, 0],
  [9.60, 1.58, -758, 30, 0, 4, -5],   // 推入棋盘（带一点 3D 倾斜）
  [15.60, 1.62, -777, 28, 0, 5, -6],
  [16.95, 1.18, -566, 134, -0.6, 2, -3],
  [19.90, 1.18, -566, 134, -0.6, 2, -3],
  [21.10, 1.08, -100, 0, 0, 0, 0],
  [23.30, 1.04, -46, 0, 0, 0, 0],
];
function camAt(t) {
  if (t <= CAM[0][0]) return CAM[0];
  for (let i = 1; i < CAM.length; i++) {
    if (t <= CAM[i][0]) {
      const a = CAM[i - 1], b = CAM[i];
      const k = easeInOut(span(t, a[0], b[0]));
      return [t, ...a.slice(1).map((v, j) => lerp(v, b[j + 1], k))];
    }
  }
  return CAM[CAM.length - 1];
}

function captionAt(t) {

  return null;

function kineticAt(t) {

/* ---------- 屏幕震动：每次落子抖一下，越大的拍子抖得越狠 ---------- */
const BEATS = [T.impact, T.appIn, T.win, T.winText, T.modeIn, T.outIn];
function shakeAt(t) {
  let amp = 0;
  for (let i = 0; i < MOVES.length; i++) {
    const dt = t - moveTime(i);
    if (dt > 0 && dt < 0.2) amp = Math.max(amp, 4.2 * (1 - dt / 0.2));
  }
  for (const b of BEATS) {
    const dt = t - b;
    if (dt > 0 && dt < 0.34) amp = Math.max(amp, 11 * (1 - dt / 0.34));
  }
  if (amp <= 0) return [0, 0, 0];
  return [Math.sin(t * 141.3) * amp, Math.cos(t * 167.7) * amp, Math.sin(t * 93.1) * amp * 0.3];
}

/* ---------- 闪光：节拍上的白闪 ---------- */
function flashAt(t) {
  let f = 0;
  const bursts = [[T.impact, 0.55, 0.30], [T.appIn, 0.22, 0.18], [T.win, 0.55, 0.26],
    [T.winText, 0.75, 0.30], [T.modeIn, 0.20, 0.16], [T.outIn, 0.30, 0.22]];
  for (const [at, peak, dur] of bursts) {
    const dt = t - at;
    if (dt > 0 && dt < dur) f = Math.max(f, peak * (1 - dt / dur) * (1 - dt / dur));
  }
  return f;
}

/* ---------- 背景粒子（屏幕空间）---------- */
function drawBack(t) {
  const w = 1920, h = 1080;
  ctxBack.clearRect(0, 0, w, h);

  // 常驻浮尘
  for (let i = 0; i < 90; i++) {
    const sp = 0.012 + hash(i * 5.3) * 0.045;
    const y = (((hash(i * 7.7) - t * sp) % 1) + 1) % 1;
    const x = (((hash(i * 3.1) + Math.sin(t * 0.35 + i) * 0.008) % 1) + 1) % 1;
    const a = 0.06 + 0.16 * hash(i * 2.2);
    ctxBack.fillStyle = `rgba(150,196,255,${a})`;
    ctxBack.beginPath();
    ctxBack.arc(x * w, y * h, 1 + hash(i * 11.1) * 2.6, 0, 6.2832);
    ctxBack.fill();
  }

  // 开场：一道白光从左飞入，命中画面中心
  const hit = T.impact;
  if (t >= T.sparkStart && t < hit + 0.05) {
    const k = span(t, T.sparkStart, hit);
    const x = lerp(-260, w / 2, easeOutQuint(k)), y = lerp(h * 0.18, h / 2, easeOutQuint(k));
    for (let i = 0; i < 26; i++) {
      const back = i * 0.024;
      const kk = clamp01(k - back / 0.5);
      if (kk <= 0) continue;
      const px = lerp(-260, w / 2, easeOutQuint(kk)), py = lerp(h * 0.18, h / 2, easeOutQuint(kk));
      ctxBack.fillStyle = `rgba(190,224,255,${(1 - i / 26) * 0.5})`;
      ctxBack.beginPath(); ctxBack.arc(px, py, 9 - i * 0.28, 0, 6.2832); ctxBack.fill();
    }
    ctxBack.fillStyle = "rgba(255,255,255,.95)";
    ctxBack.beginPath(); ctxBack.arc(x, y, 11, 0, 6.2832); ctxBack.fill();
  }
  // 命中冲击波
  const wk = span(t, hit, hit + 1.15);
  if (wk > 0 && wk < 1) {
    const r = easeOut(wk) * 1500;
    ctxBack.strokeStyle = `rgba(190,224,255,${(1 - wk) * 0.5})`;
    ctxBack.lineWidth = 26 * (1 - wk) + 1;
    ctxBack.beginPath(); ctxBack.arc(w / 2, h / 2, r, 0, 6.2832); ctxBack.stroke();
  }
  // 五连爆发：全屏放射
  const bw = span(t, T.win, T.win + 1.1);
  if (bw > 0 && bw < 1) {
    ctxBack.strokeStyle = `rgba(255,214,120,${(1 - bw) * 0.42})`;
    ctxBack.lineWidth = 34 * (1 - bw) + 1;
    ctxBack.beginPath(); ctxBack.arc(w / 2, h * 0.55, easeOut(bw) * 1300, 0, 6.2832); ctxBack.stroke();
  }
}

/* ---------- 棋盘内特效（棋盘坐标系，自动跟着镜头变换）---------- */
function drawBoard(t) {
  ctxBoard.clearRect(0, 0, SPAN, SPAN);
  const winDone = t >= T.win;

  for (let i = 0; i < MOVES.length; i++) {
    const dt = t - moveTime(i);
    if (dt < 0 || dt > 0.6) continue;
    const [row, col] = MOVES[i];
    const cx = coordOf(col), cy = coordOf(row);
    const rk = clamp01(dt / 0.5);
    // 冲击环
    ctxBoard.beginPath();
    ctxBoard.arc(cx, cy, 9 + easeOut(rk) * 52, 0, 6.2832);
    ctxBoard.strokeStyle = `rgba(255,240,180,${(1 - rk) * 0.6})`;
    ctxBoard.lineWidth = 3.4 * (1 - rk) + 0.5;
    ctxBoard.stroke();
    // 火花
    const n = i === MOVES.length - 1 ? 30 : 16;
    for (let j = 0; j < n; j++) {
      const a = hash(i * 97 + j * 13.7) * 6.2832;
      const sp = 70 + hash(i * 31 + j * 7.3) * (i === MOVES.length - 1 ? 420 : 260);
      const d = sp * dt;
      const px = cx + Math.cos(a) * d;
      const py = cy + Math.sin(a) * d + 150 * dt * dt;
      const al = Math.max(0, 1 - dt / 0.55);
      ctxBoard.fillStyle = j % 3 === 0
        ? `rgba(130,205,255,${al})` : `rgba(255,228,150,${al})`;
      ctxBoard.beginPath(); ctxBoard.arc(px, py, 2.4 * al + 0.5, 0, 6.2832); ctxBoard.fill();
    }
  }

  // 五连：沿连线喷出的能量 + 十字放射
  if (winDone) {
    const dt = t - T.win;
    if (dt < 1.5) {
      const mid = { x: coordOf(WIN[2][1]), y: coordOf(WIN[2][0]) };
      for (let j = 0; j < 70; j++) {
        const a = hash(j * 17.3) * 6.2832;
        const sp = 160 + hash(j * 29.1) * 620;
        const d = sp * dt;
        const al = Math.max(0, 1 - dt / 1.1) * (0.5 + 0.5 * hash(j * 5.7));
        const px = mid.x + Math.cos(a) * d;
        const py = mid.y + Math.sin(a) * d * 0.55 + 220 * dt * dt;
        ctxBoard.fillStyle = j % 4 === 0 ? `rgba(140,210,255,${al})` : `rgba(255,226,140,${al})`;
        ctxBoard.beginPath(); ctxBoard.arc(px, py, 1 + hash(j * 3.3) * 3.2, 0, 6.2832); ctxBoard.fill();
      }
    }
  }
}

/* ---------- 逐帧渲染 ---------- */
function seek(t) {
  const drift = t * 12;
  el("bgGlow").style.transform = `translate3d(${-drift * 0.35}px,${drift * 0.16}px,0) scale(1.14)`;
  el("bgGrid").style.transform = `translate3d(${-drift * 0.6}px,${drift * 0.26}px,0) scale(1.08)`;
  drawBack(t);
  drawBoard(t);
  el("flash").style.opacity = String(flashAt(t));

  /* ===== 开场 ===== */
  const introOn = t < T.introEnd + 0.2;
  show(el("s1"), introOn);
  if (introOn) {
    const heroK = easeOutQuint(span(t, T.heroIn, T.heroIn + 1.5));
    const outK = span(t, T.heroOut, T.introEnd + 0.2);
    const appear = span(t, T.heroIn - 0.05, T.heroIn + 0.25);
    // 棋盘：从远处带角度飞入，逐渐转正并放大；最后冲向镜头（切场）
    const fly = easeInOut(span(t, T.heroOut, T.introEnd + 0.2));
    setStyle(hero, {
      opacity: String(appear * (1 - fly)),
      transform: `perspective(1500px) `
        + `translate3d(0,${lerp(90, 0, heroK)}px,${lerp(-520, 0, heroK)}px) `
        + `rotateX(${lerp(62, 24, heroK)}deg) rotateZ(${lerp(-24, -7, heroK)}deg) `
        + `scale(${lerp(0.72, 1, heroK) * lerp(1, 2.15, fly)})`,
    });
    // 掠过棋盘的高光
    const sweepK = span(t, 0.8, 2.3);
    setStyle(el("sweep"), {
      opacity: String(Math.sin(Math.PI * sweepK) * 0.9),
      transform: `translateX(${lerp(-70, 70, sweepK)}%)`,
    });

    const titleK = span(t, T.titleIn, T.titleIn + 0.42);
    const titleEase = easeOutQuint(titleK);
    setStyle($("#s1 .stack"), { opacity: String(1 - outK), transform: `translateY(${-outK * 60}px)` });
    setStyle(el("s1kick"), { opacity: String(span(t, T.heroIn, T.heroIn + 0.5)), letterSpacing: `${lerp(0.9, 0.42, easeOut(span(t, T.heroIn, T.heroIn + 0.9)))}em` });
    setStyle(title, {
      opacity: String(clamp01(titleK * 3)),
      transform: `scale(${lerp(1.75, 1, titleEase)}) translateY(${lerp(26, 0, titleEase)}px)`,
      filter: `blur(${lerp(14, 0, clamp01(titleK * 1.6))}px)`,
    });
    // 色差：命中瞬间最强，然后收敛
    const ca = Math.max(0, 1 - span(t, T.titleIn, T.titleIn + 0.34)) * 0.95;
    title.style.setProperty("--ca", String(ca));
    title.style.setProperty("--cx", `${ca * 26}px`);
    const subK = easeOut(span(t, T.subIn, T.subIn + 0.6));
    setStyle(el("s1sub"), { opacity: String(subK * (1 - outK)), transform: `translateY(${(1 - subK) * 26}px)` });
    const ruleK = easeOut(span(t, T.ruleIn, T.ruleIn + 0.7));
    setStyle(el("s1rule"), { width: `${ruleK * 520}px`, opacity: String(ruleK * (1 - outK)) });
  }

  /* ===== 主界面 ===== */
  const appOn = t >= T.appIn - 0.45 && t < T.outIn;
  show(el("app"), appOn);
  if (appOn) {
    const inK = easeOutQuint(span(t, T.appIn, T.appInEnd));
    const sideK = easeOutQuint(span(t, T.sideIn, T.sideInEnd));
    const [, cs, cx2, cy2, crz, crx, cry] = camAt(t);
    setStyle(el("cam"), {
      transform: `translate3d(${cx2}px,${cy2}px,0) scale(${cs}) rotateZ(${crz}deg) `
        + `rotateX(${crx}deg) rotateY(${cry}deg)`,
      opacity: String(inK * (1 - span(t, T.outIn - 0.45, T.outIn))),
    });
    setStyle(el("cam").firstElementChild, {
      transform: `translateY(${(1 - inK) * 90}px)`,
    });
    setStyle(el("side"), { transform: `translateX(${(1 - sideK) * 130}px)`, opacity: String(sideK) });

    chatEls.forEach((node, i) => {
      const at = T.chat[i];
      const k = easeOutQuint(span(t, at, at + 0.5));
      setStyle(node, { opacity: String(k), transform: `translateY(${(1 - k) * 22}px) scale(${lerp(0.96, 1, k)})` });
    });
    const composerAt = T.chat[T.chat.length - 1] + 0.45;
    setStyle(el("composerText"), { opacity: String(0.85 * span(t, composerAt, composerAt + 0.4)) });
    setStyle($(".composer .caret"), { opacity: String(t > composerAt ? (Math.floor(t * 5) % 2 === 0 ? 1 : 0.15) : 0) });

    /* 棋子 */
    let landed = 0;
    for (let i = 0; i < MOVES.length; i++) if (t >= moveTime(i)) landed = i + 1;
    const finished = t >= GAME_END;
    stoneEls.forEach((node, i) => {
      if (i >= landed) { node.setAttribute("opacity", "0"); node.removeAttribute("transform"); return; }
      const k = clamp01((t - moveTime(i)) / 0.17);
      const scale = 1 + 0.46 * Math.pow(1 - easeOutQuint(k), 2.2);
      const [row, col] = MOVES[i];
      const px = coordOf(col), py = coordOf(row);
      const dim = finished && !WIN_KEYS.has(row + ":" + col) ? 0.38 : 1;
      node.setAttribute("opacity", String(Math.min(1, k * 2.2) * dim));
      node.setAttribute("transform", `translate(${px} ${py}) scale(${scale}) translate(${-px} ${-py})`);
    });

    /* 最后一手环 */
    const lastRing = el("p-lastRing");
    if (landed > 0 && !finished) {
      const [row, col, color] = MOVES[landed - 1];
      const since = t - moveTime(landed - 1);
      lastRing.setAttribute("cx", String(coordOf(col)));
      lastRing.setAttribute("cy", String(coordOf(row)));
      lastRing.setAttribute("stroke", color === 1 ? "rgba(255,255,255,.95)" : "rgba(28,20,8,.85)");
      lastRing.setAttribute("r", String(4.4 * (1 + 0.22 * Math.sin(clamp01(since / 0.45) * Math.PI))));
      lastRing.setAttribute("opacity", String(clamp01(since / 0.1)));
    } else {
      lastRing.setAttribute("opacity", "0");
    }

    /* 取胜连线 */
    const winK = span(t, T.win, T.win + 0.5);
    if (winK > 0) {
      el("p-winLayer").setAttribute("opacity", "1");
      const len = 4 * STEP;
      el("p-winLine").setAttribute("stroke-dasharray", String(len));
      el("p-winLine").setAttribute("stroke-dashoffset", String(len * (1 - easeOut(winK))));
      el("p-winGlow").setAttribute("stroke-width", String(8 + (winK > 0.5 ? 4.5 * Math.sin(t * 11) : 0)));
    } else {
      el("p-winLayer").setAttribute("opacity", "0");
    }

    /* 棋盘霓虹呼吸：每次落子脉一下 */
    let glow = 0;
    for (let i = Math.max(0, landed - 3); i < landed; i++) {
      const dt = t - moveTime(i);
      if (dt >= 0 && dt < 0.5) glow = Math.max(glow, 1 - dt / 0.5);
    }
    if (t >= T.win) glow = Math.max(glow, 0.6 + 0.4 * Math.sin(t * 6));
    el("boardFrame").style.boxShadow = `0 26px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07), `
      + `0 0 ${18 + glow * 60}px rgba(255,200,110,${0.16 + glow * 0.4})`;

    /* 状态条 */
    const lastMove = landed > 0 ? MOVES[landed - 1] : null;
    el("pillMoves").textContent = `第 ${landed} 手`;
    el("pillLast").textContent = lastMove === null ? "等待落子"
      : `${lastMove[2] === 1 ? "黑" : "白"} (${lastMove[0]}, ${lastMove[1]}) · ${lastMove[2] === 1 ? "引擎" : "你"}`;

    /* 引擎应手徽章 */
    let badge = null;
    if (!finished && landed > 0) {
      for (let i = landed - 1; i >= Math.max(0, landed - 3); i--) {
        if (MOVES[i][2] !== 1) continue;
        const since = t - moveTime(i);
        if (since >= 0 && since < 0.85) { badge = { i, since }; break; }
      }
    }
    if (badge !== null) {
      const [row, col] = MOVES[badge.i];
      const pop = easeOutQuint(span(badge.since, 0, 0.14));
      const fade = 1 - span(badge.since, 0.6, 0.85);
      latency.innerHTML = `引擎应手 <b>${ENGINE_MS} ms</b> · 第 ${badge.i + 1} 手`;
      setStyle(latency, {
        left: `${coordOf(col) + 18}px`, top: `${coordOf(row) - 54}px`,
        opacity: String(clamp01(pop) * clamp01(fade)),
        transform: `scale(${lerp(0.7, 1, clamp01(pop))})`,
      });
      show(latency, true);
    } else {
      show(latency, false);
    }
  }

  /* ===== 动能大字 ===== */
  const kin = kineticAt(t);
  show(kinetic, kin !== null);
  if (kin !== null) {
    const inK = easeOutQuint(span(t, kin.a, kin.a + 0.42));
    const outK = span(t, kin.b - 0.35, kin.b);
    setStyle(kinetic, { opacity: String(clamp01(inK) * (1 - outK)) });
    if (el("kinTitle").textContent !== kin.title) {
      el("kinTitle").textContent = kin.title;
      el("kinSub").textContent = kin.sub;
    }
    setStyle(el("kinTitle"), {
      opacity: "1",
      transform: `scale(${lerp(1.35, 1, inK)}) translateY(${lerp(20, 0, inK)}px)`,
      filter: `blur(${lerp(9, 0, clamp01(inK * 1.8))}px)`,
    });
    setStyle(el("kinSub"), { opacity: String(easeOut(span(t, kin.a + 0.22, kin.a + 0.7))) });
    setStyle(el("kinRule"), { width: `${easeOut(span(t, kin.a + 0.15, kin.a + 0.8)) * 620}px`, opacity: String(inK) });
  }

  /* ===== 五连 ===== */
  const s4On = t >= T.win - 0.35 && t < T.modeIn;
  show(el("s4"), s4On);
  if (s4On) {
    const k = easeOutQuint(span(t, T.winText, T.winText + 0.5));
    const outK = span(t, T.modeIn - 0.4, T.modeIn);
    setStyle(el("s4win"), {
      opacity: String(clamp01(k) * (1 - outK)),
      transform: `scale(${lerp(0.45, 1, k)}) translateY(${-outK * 30}px)`,
    });
    const wca = Math.max(0, 1 - span(t, T.winText, T.winText + 0.34)) * 1.1;
    s4chroma.style.setProperty("--ca", String(wca));
    s4chroma.style.setProperty("--cx", `${wca * 30}px`);
    const restK = easeOut(span(t, T.winText + 0.2, T.winText + 0.85));
    for (const sel of ["#s4sub", ".chips"]) {
      setStyle($("#s4 " + sel), { opacity: String(restK * (1 - outK)), transform: `translateY(${(1 - restK) * 22}px)` });
    }
    const shockK = span(t, T.win, T.win + 0.95);
    setStyle(el("shock"), {
      opacity: String((1 - shockK) * 0.95),
      transform: `scale(${lerp(0.15, 10, easeOut(shockK))})`,
    });
  }

  /* ===== 模式 ===== */
  const s5On = t >= T.modeIn && t < T.outIn;
  show(el("s5"), s5On);
  if (s5On) {
    const headK = easeOutQuint(span(t, T.modeIn, T.modeIn + 0.45));
    setStyle($("#s5 .head"), { opacity: String(headK), transform: `translateY(${(1 - headK) * 26}px) scale(${lerp(1.12, 1, headK)})` });
    cardEls.forEach((node, i) => {
      const at = T.modeIn + 0.2 + i * 0.13;
      const k = easeOutQuint(span(t, at, at + 0.5));
      setStyle(node, {
        opacity: String(k),
        transform: `translateY(${(1 - k) * 60}px) rotateX(${lerp(-38, 0, k)}deg) scale(${lerp(0.92, 1, k)})`,
      });
      const step = t < T.modeIn + 1.35 ? 0 : t < T.modeIn + 1.95 ? 1 : 2;
      const on = step === i;
      setStyle(glowEls[i], {
        boxShadow: on ? "0 0 0 2.5px rgba(120,190,255,.95) inset, 0 0 60px rgba(76,141,255,.5)" : "none",
        background: on ? "linear-gradient(180deg,rgba(76,141,255,.20),rgba(76,141,255,0) 62%)" : "none",
      });
    });
  }

  /* ===== 收尾 ===== */
  const s6On = t >= T.outIn;
  show(el("s6"), s6On);
  if (s6On) {
    const k = easeOutQuint(span(t, T.outIn + 0.05, T.outIn + 0.75));
    const fade = 1 - span(t, T.outEnd - 0.8, T.outEnd);
    setStyle($("#s6 .col"), {
      opacity: String(clamp01(k) * clamp01(fade)),
      transform: `translateY(${(1 - k) * 40}px) scale(${lerp(0.94, 1, k)})`,
    });
    setStyle($("#s6 .icon"), { transform: `scale(${lerp(0.5, 1, easeOutQuint(span(t, T.outIn, T.outIn + 0.6)))})` });
  }

  /* ===== 字幕 ===== */
  const cap = captionAt(t);
  show(el("caption"), cap !== null);
  if (cap !== null) {
    const k = clamp01(easeOut(span(t, cap.a, cap.a + 0.4)) * (1 - span(t, cap.b - 0.3, cap.b)));
    setStyle(capInner, { opacity: String(k), transform: `translateY(${(1 - k) * 20}px) scale(${lerp(0.96, 1, k)})` });
    capText.textContent = cap.text;
  }

  /* ===== 屏幕震动（作用在世界层）===== */
  const [sx, sy, sr] = shakeAt(t);
  el("world").style.transform = `translate3d(${sx}px,${sy}px,0) rotate(${sr}deg)`;

  return true;
}

window.__seek = seek;
window.__duration = DURATION;

/* 先自检一遍所有要摸的元素都在。
   为什么值得单独做这一步：seek() 里任何一处 `.innerHTML = ...` 撞上 null，都会在
   中途抛错，于是**它之后的每个场景整块不动**（大字不出现、字幕不出现、震动没反应），
   而画面看上去只是"少了几样东西"——最费时间的一类 bug（latency 那个 div 漏掉时，
   半部片子的元素都停在前一帧）。这里一次性把缺失的 id 报出来，且加载即失败。 */
const REQUIRED = [
  "stage", "world", "bgGlow", "bgGrid", "fxBack", "s1", "heroBoard", "sweep", "s1kick", "s1title", "s1sub", "s1rule",
  "app", "cam", "side", "msgs", "composerText", "boardFrame", "boardFx", "latency",
  "pillMoves", "pillLast", "kinetic", "kinTitle", "kinSub", "kinRule",
  "s4", "s4win", "s4sub", "shock", "s5", "s5cards", "s6", "s6icon", "s6code",
  "caption", "capInner", "capText", "vig", "scan", "bars", "flash",
  "p-stones", "p-winLayer", "p-winLine", "p-winGlow", "p-lastRing",
];
const missing = REQUIRED.filter((id) => document.getElementById(id) === null);
if (missing.length > 0) throw new Error(`promo.html 缺少元素：#${missing.join(" #")}`);

seek(0);
</script>
</body>
