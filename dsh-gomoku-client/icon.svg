<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Gomoku">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d7a8"/>
      <stop offset="0.55" stop-color="#e5bd82"/>
      <stop offset="1" stop-color="#d09e5d"/>
    </linearGradient>
    <radialGradient id="blackStone" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#7c7c82"/>
      <stop offset="0.45" stop-color="#33333a"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </radialGradient>
    <radialGradient id="whiteStone" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2eee7"/>
      <stop offset="1" stop-color="#c6c0b6"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="2.5" y="2.5" width="43" height="43" rx="9"/>
    </clipPath>
  </defs>

  <!-- 棋盘 -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="9" fill="url(#wood)"/>
  <g clip-path="url(#frame)">
    <path d="M-4 15 L52 5" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.28"/>
    <path d="M-4 36 L52 27" stroke="#8a5a2b" stroke-width="3" fill="none" opacity="0.14"/>
  </g>

  <!-- 棋路：以中心为对称轴的四条线 -->
  <g stroke="#8a5a2b" stroke-width="1" opacity="0.6" stroke-linecap="round">
    <path d="M13.2 7.5V40.5"/>
    <path d="M20.4 7.5V40.5"/>
    <path d="M27.6 7.5V40.5"/>
    <path d="M34.8 7.5V40.5"/>
    <path d="M7.5 13.2H40.5"/>
    <path d="M7.5 20.4H40.5"/>
    <path d="M7.5 27.6H40.5"/>
    <path d="M7.5 34.8H40.5"/>
  </g>

  <!-- 内框高光 -->
  <rect x="4.8" y="4.8" width="38.4" height="38.4" rx="7.2" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

  <!-- 黑子（左上角星位） -->
  <ellipse cx="13.6" cy="13.6" rx="5.4" ry="5.2" fill="#3a230c" opacity="0.3"/>
  <circle cx="13.2" cy="13.2" r="5.6" fill="url(#blackStone)"/>
  <circle cx="13.2" cy="13.2" r="5.6" fill="none" stroke="#000000" stroke-width="0.7" opacity="0.4"/>
  <ellipse cx="11.4" cy="11.2" rx="2.3" ry="1.6" fill="#ffffff" opacity="0.5" transform="rotate(-32 11.4 11.2)"/>

  <!-- 白子（右下角星位） -->
  <ellipse cx="35.2" cy="35.2" rx="5.4" ry="5.2" fill="#3a230c" opacity="0.3"/>
  <circle cx="34.8" cy="34.8" r="5.6" fill="url(#whiteStone)"/>
  <circle cx="34.8" cy="34.8" r="5.6" fill="none" stroke="#8d8577" stroke-width="0.7" opacity="0.7"/>
  <ellipse cx="33" cy="32.8" rx="2.3" ry="1.6" fill="#ffffff" opacity="0.9" transform="rotate(-32 33 32.8)"/>

  <!-- 外描边 -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="9" fill="none" stroke="#a8743c" stroke-width="1.4"/>
</svg>
